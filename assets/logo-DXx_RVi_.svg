<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Instagram-style vibrant gradient -->
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDC80" />
      <stop offset="25%" stop-color="#F77737" />
      <stop offset="50%" stop-color="#F56040" />
      <stop offset="75%" stop-color="#FD1D1D" />
      <stop offset="90%" stop-color="#C13584" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>

    <!-- Drop Shadow for layered elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background App Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#igGradient)" />

  <!-- Inner Soft Lighting Border -->
  <rect x="34" y="34" width="444" height="444" rx="108" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />

  <!-- Main Content Group -->
  <g filter="url(#dropShadow)">
    <!-- User Profile Silhouette (Head) -->
    <circle cx="230" cy="190" r="64" fill="#FFFFFF" />

    <!-- User Profile Silhouette (Shoulders / Torso) -->
    <path d="M120 350 C120 280, 170 265, 230 265 C290 265, 340 280, 340 350 Z" fill="#FFFFFF" />

    <!-- Action Badge: "Delete / Unfollow" Bubble -->
    <g transform="translate(330, 310)">
      <!-- Badge Outer Ring / Glow -->
      <circle cx="0" cy="0" r="58" fill="#18181B" stroke="#FFFFFF" stroke-width="8" />
      
      <!-- Minimalist 'Minus' / Del Symbol -->
      <rect x="-26" y="-6" width="52" height="12" rx="6" fill="#EF4444" />
    </g>
  </g>
</svg>
